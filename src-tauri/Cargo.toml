[package]
name = "ssh-tunnel-manager"
version = "0.1.0"
description = "Cross-platform SSH tunnel manager"
authors = ["fjjupc"]
edition = "2021"

[lib]
name = "ssh_tunnel_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
russh = "0.50"
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"
futures = "0.3"
log = "0.4"
env_logger = "0.11"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "unwind"
strip = true
